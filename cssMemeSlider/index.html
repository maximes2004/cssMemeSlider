<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Веселые мемы</title>
    <link rel="stylesheet" href="normalize.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <section class="slider">
        <div class="slider__track">
          <section class="slide slider__slide">
            <img class="slide__img" src="/img/druzhko.jpg" alt="Дружко собирается рассказать про мемы" />
            <p class="slide__description">Мемы от Дружко</p>
          </section>
          <section class="slide slider__slide">
            <img class="slide__img" src="img/lapenko_ustal.jpg" alt="Инженер из 'Внутри Лапенко' жалуется на усталость" />
            <p class="slide__description">Инженер устал</p>
          </section>
          <section class="slide slider__slide">
            <img class="slide__img" src="img/wisdom.jpg" alt="Темнокожий мужчина с умным видом говорит глупости" />
            <p class="slide__description">Подумай над этим</p>
          </section>
          <section class="slide slider__slide">
            <img class="slide__img" src="img/buildin_fire.jpg" alt="Упитанная черная женщина смешно реагирует на пожар" />
            <p class="slide__description">My building is on fire!</p>
          </section>
          <section class="slide slider__slide">
            <img class="slide__img" src="img/luka_gta.jpg" alt="Лукашенко с автоматом в мире GTA San Andreas" />
            <p class="slide__description">Картофельный коммандос и его движуха</p>
          </section>
          <section class="slide slider__slide">
            <img class="slide__img" src="img/astanavites.jpg" alt="Янукович, как в Матрице, пытается остановить пули словом 'Астанавитесь!'" />
            <p class="slide__description">Волшебное слово от Януковича</p>
          </section>
        </div>
        <nav class="slider__nav">
          <a class="slider__nav-link" href="" aria-label="Слайд 1 из 6"></a>
          <a class="slider__nav-link" href="" aria-label="Слайд 2 из 6"></a>
          <a class="slider__nav-link" href="" aria-label="Слайд 3 из 6"></a>
          <a class="slider__nav-link" href="" aria-label="Слайд 4 из 6"></a>
          <a class="slider__nav-link" href="" aria-label="Слайд 5 из 6"></a>
          <a class="slider__nav-link" href="" aria-label="Слайд 6 из 6"></a>
        </nav>
      </section>
    </main>
  </body>
</html>
